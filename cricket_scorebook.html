<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Scorebook</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
header{background:#0b5d3b;color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header h1{margin:0;font-size:24px}.badge{background:#083f29;padding:7px 12px;border-radius:20px;font-size:13px}
.container{max-width:1250px;margin:auto;padding:18px}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0000000d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{font-size:12px;color:#667085;font-weight:bold;display:block;margin-bottom:5px}
input,select,button{width:100%;padding:10px;border:1px solid #d7dce5;border-radius:8px;font-size:14px}
button{cursor:pointer;font-weight:bold;background:#0b5d3b;color:white;border:0}
button.secondary{background:#eaf4ef;color:#0b5d3b}.danger{background:#c62828}
.score{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.big{font-size:34px;font-weight:800}.stat{background:#f7faf8;padding:12px;border-radius:10px}.stat small{display:block;color:#667085}
.actions{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
.actions button{font-size:16px;padding:14px 5px}.run{background:#eef6ff;color:#174ea6}
.wicket{background:#8b1e1e}.wide{background:#805a00}.noball{background:#7040a0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e8ebf0;text-align:center}th{background:#f5f7fa}
.left{text-align:left}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{width:auto;padding:9px 16px}.tabs .active{background:#0b5d3b}
.hidden{display:none}.pill{display:inline-block;padding:4px 8px;border-radius:12px;background:#eef2f7}
#overs{max-height:300px;overflow:auto}
@media(max-width:700px){.score{grid-template-columns:1fr 1fr}.actions{grid-template-columns:repeat(4,1fr)}header h1{font-size:20px}}
</style>
</head>
<body>
<header>
  <h1>🏏 Cricket Scorebook</h1>
  <span class="badge">Live Scoring • History • Batting • Bowling</span>
</header>

<div class="container">
  <div class="card">
    <div class="grid">
      <div><label>TEAM A</label><input id="teamA" value="Team A"></div>
      <div><label>TEAM B</label><input id="teamB" value="Team B"></div>
      <div><label>OVERS</label><input id="maxOvers" type="number" value="20" min="1"></div>
      <div><label>STRIKER</label><select id="striker"></select></div>
      <div><label>NON-STRIKER</label><select id="nonStriker"></select></div>
      <div><label>BOWLER</label><select id="bowler"></select></div>
    </div>
  </div>

  <div class="card score">
    <div class="stat"><small>SCORE</small><span class="big" id="score">0/0</span></div>
    <div class="stat"><small>OVERS</small><b id="oversText">0.0</b></div>
    <div class="stat"><small>CRR</small><b id="crr">0.00</b></div>
    <div class="stat"><small>LAST BALL</small><b id="lastBall">-</b></div>
  </div>

  <div class="card">
    <h3>Scoring</h3>
    <div class="actions">
      <button class="run" onclick="addBall(0)">DOT</button>
      <button class="run" onclick="addBall(1)">1 RUN</button>
      <button class="run" onclick="addBall(2)">2 RUN</button>
      <button class="run" onclick="addBall(3)">3 RUN</button>
      <button class="run" onclick="addBall(4)">4 RUN</button>
      <button class="run" onclick="addBall(6)">6 RUN</button>
      <button class="wide" onclick="addExtra('WD')">WIDE</button>
      <button class="noball" onclick="addExtra('NB')">NO BALL</button>
      <button onclick="addExtra('B')">BYE</button>
      <button onclick="addExtra('LB')">LEG BYE</button>
      <button class="wicket" onclick="addWicket()">WICKET</button>
      <button class="secondary" onclick="undo()">UNDO</button>
      <button class="danger" onclick="resetMatch()">RESET</button>
    </div>
  </div>

  <div class="tabs">
    <button class="active" onclick="showTab('bat',this)">Batting</button>
    <button onclick="showTab('bowl',this)">Bowling</button>
    <button onclick="showTab('ball',this)">Ball-by-Ball</button>
    <button onclick="showTab('history',this)">Match History</button>
  </div>

  <div id="bat" class="card">
    <h3>🏏 Batting Scorecard</h3>
    <table><thead><tr><th class="left">Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th><th>Status</th></tr></thead>
    <tbody id="batBody"></tbody></table>
  </div>

  <div id="bowl" class="card hidden">
    <h3>🎯 Bowling Scorecard</h3>
    <table><thead><tr><th class="left">Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Eco</th></tr></thead>
    <tbody id="bowlBody"></tbody></table>
  </div>

  <div id="ball" class="card hidden">
    <h3>📋 Ball-by-Ball</h3>
    <div id="overs"></div>
  </div>

  <div id="history" class="card hidden">
    <h3>🗂 Match History</h3>
    <table><thead><tr><th>Time</th><th>Event</th><th>Score</th><th>Overs</th></tr></thead>
    <tbody id="historyBody"></tbody></table>
  </div>
</div>

<script>
const players = ["Player 1","Player 2","Player 3","Player 4","Player 5","Player 6","Player 7","Player 8","Player 9","Player 10","Player 11"];
let batters={}, bowlers={}, balls=[], history=[], total=0, wickets=0, legalBalls=0, currentOver=[];
let striker="Player 1", nonStriker="Player 2", bowler="Player 3";

players.forEach(p=>batters[p]={r:0,b:0,f4:0,f6:0,out:false});
players.forEach(p=>bowlers[p]={balls:0,r:0,w:0,maidens:0});

function fillSelect(id, selected){
  const s=document.getElementById(id); s.innerHTML="";
  players.forEach(p=>{let o=document.createElement("option");o.value=p;o.textContent=p;if(p===selected)o.selected=true;s.appendChild(o)});
}
fillSelect("striker",striker);fillSelect("nonStriker",nonStriker);fillSelect("bowler",bowler);

document.getElementById("striker").onchange=e=>striker=e.target.value;
document.getElementById("nonStriker").onchange=e=>nonStriker=e.target.value;
document.getElementById("bowler").onchange=e=>bowler=e.target.value;

function rotate(){[striker,nonStriker]=[nonStriker,striker];document.getElementById("striker").value=striker;document.getElementById("nonStriker").value=nonStriker}
function overCheck(){
  if(legalBalls%6===0){bowlers[bowler].maidens += currentOver.every(x=>x.r===0 && !x.extra) ? 1:0; currentOver=[]; rotate();}
}
function record(event, runs, legal=true, extra=""){
  total+=runs;
  if(legal){legalBalls++;bowlers[bowler].balls++}
  bowlers[bowler].r += (extra==="WD"||extra==="NB"||extra==="RUN")?runs:0;
  balls.push({event,r:runs,legal,extra,bat:striker,bowl:bowler,over:Math.floor((legalBalls-1)/6),ball:legalBalls%6||6});
  history.unshift({time:new Date().toLocaleTimeString(),event,score:`${total}/${wickets}`,overs:oversText()});
  document.getElementById("lastBall").textContent=event;
  overCheck(); render();
}
function addBall(r){
  let b=batters[striker]; b.r+=r;b.b++;if(r===4)b.f4++;if(r===6)b.f6++;
  if(r%2) rotate();
  record(r===0?"0":String(r),r,true,"");
}
function addExtra(type){
  if(type==="WD"||type==="NB"){total++;bowlers[bowler].r++;record(type,1,false,type)}
  else {batters[striker].b++;record(type,0,true,type)}
}
function addWicket(){
  batters[striker].b++;batters[striker].out=true;wickets++;
  bowlers[bowler].w++;record("W",0,true,"W");
  let replacement=players.find(p=>!batters[p].out && p!==striker && p!==nonStriker);
  if(replacement){striker=replacement;document.getElementById("striker").value=striker}
}
function oversText(){return Math.floor(legalBalls/6)+"."+(legalBalls%6)}
function undo(){
  if(!balls.length)return;
  // Restore by replaying all actions except the last.
  const old=balls.slice(0,-1); resetData(false);
  old.forEach(x=>{
    if(x.event==="W"){addWicket();}
    else if(x.extra==="WD"||x.extra==="NB"){addExtra(x.extra)}
    else if(["B","LB"].includes(x.extra)){addExtra(x.extra)}
    else {addBall(x.r)}
  });
}
function resetData(clearHistory=true){
  players.forEach(p=>batters[p]={r:0,b:0,f4:0,f6:0,out:false});
  players.forEach(p=>bowlers[p]={balls:0,r:0,w:0,maidens:0});
  balls=[];total=0;wickets=0;legalBalls=0;currentOver=[];if(clearHistory)history=[];
  striker="Player 1";nonStriker="Player 2";bowler="Player 3";
  fillSelect("striker",striker);fillSelect("nonStriker",nonStriker);fillSelect("bowler",bowler);
}
function resetMatch(){if(confirm("Reset the entire match?")){resetData();render()}}
function render(){
  document.getElementById("score").textContent=`${total}/${wickets}`;
  document.getElementById("oversText").textContent=oversText();
  document.getElementById("crr").textContent=legalBalls?(total/(legalBalls/6)).toFixed(2):"0.00";
  document.getElementById("batBody").innerHTML=players.map(p=>{
    let b=batters[p], sr=b.b?(b.r/b.b*100).toFixed(1):"0.0";
    return `<tr><td class="left">${p}</td><td>${b.r}</td><td>${b.b}</td><td>${b.f4}</td><td>${b.f6}</td><td>${sr}</td><td>${b.out?"OUT":(p===striker?"*":"not out")}</td></tr>`
  }).join("");
  document.getElementById("bowlBody").innerHTML=players.map(p=>{
    let b=bowlers[p], o=Math.floor(b.balls/6)+"."+b.balls%6, eco=b.balls?(b.r/(b.balls/6)).toFixed(2):"0.00";
    return `<tr><td class="left">${p}</td><td>${o}</td><td>${b.maidens}</td><td>${b.r}</td><td>${b.w}</td><td>${eco}</td></tr>`
  }).join("");
  document.getElementById("overs").innerHTML=balls.length?balls.map((x,i)=>`<span class="pill">${Math.floor(i/6)+1}.${(i%6)+1}: ${x.event}</span> `).join(""):"No balls yet.";
  document.getElementById("historyBody").innerHTML=history.map(x=>`<tr><td>${x.time}</td><td>${x.event}</td><td>${x.score}</td><td>${x.overs}</td></tr>`).join("");
  localStorage.setItem("cricketScorebook",JSON.stringify({batters,bowlers,balls,history,total,wickets,legalBalls,striker,nonStriker,bowler}));
}
function showTab(id,btn){
  ["bat","bowl","ball","history"].forEach(x=>document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
}
render();
</script>
</body>
</html>
